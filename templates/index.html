<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIA Bot - Interface de Chat</title>
    
    <!-- Bootstrap CSS (Replit dark theme) -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-4 mb-4">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header furia-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fab fa-telegram-plane me-2"></i>
                            FURIA Bot
                        </h4>
                        <div>
                            <span id="connection-status" class="badge bg-success">
                                <i class="fas fa-circle"></i> Conectado
                            </span>
                        </div>
                    </div>
                    
                    <div class="card-body p-0">
                        <div id="chat-container" class="chat-container">
                            <!-- Messages will be dynamically added here -->
                        </div>
                        
                        <!-- Typing indicator -->
                        <div id="typing-indicator" class="typing-indicator d-none">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <form id="message-form" class="d-flex gap-2">
                            <input 
                                type="text" 
                                id="message-input" 
                                class="form-control" 
                                placeholder="Digite sua mensagem..." 
                                autocomplete="off"
                                required
                            >
                            <button type="submit" class="btn btn-furia">
                                <i class="fas fa-paper-plane"></i>
                                <span class="d-none d-md-inline ms-1">Enviar</span>
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Information card -->
                <div class="card mt-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-info-circle me-2"></i>
                            Sobre esta Interface
                        </h5>
                        <p class="card-text">
                            Esta é uma interface web para o FURIA Bot. As respostas do bot são processadas através desta interface para facilitar a interação.
                        </p>
                        <p class="card-text small text-muted">
                            <i class="fas fa-lightbulb me-1"></i>
                            Experimente usar os comandos /start, /jogadores, /jogos, ou /noticias!
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
